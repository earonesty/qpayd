[server]
listen = "0.0.0.0:8080"
onchain_poll_seconds = 30

[server.admin]
enabled = true
asset_source = "https://cdn.jsdelivr.net/npm/@qpayd/admin@0.6.1/src/index.js"
asset_integrity = "sha384-2GxDGhl/q1if7IgqNtIEyE668TpeYGOaBTYtJ2gnTh7bwFe7ODT5gZ/L8R7IMXQv"

[database]
url = "sqlite:///data/qpayd.db"

[pricing]
kraken_url = "https://api.kraken.com/0/public/Ticker"
stale_after_seconds = 60

[[stores]]
id = "q32"
name = "Q32"
api_token_env = "QPAYD_Q32_API_TOKEN"
admin_token_env = "QPAYD_Q32_ADMIN_TOKEN"
invoice_expiry_minutes = 15
min_confirmations = 1
public_allowed_origins = ["https://qpayd.com", "https://earonesty.github.io"]
admin_allowed_origins = ["https://pay-q32.fly.dev"]

[stores.onchain]
network = "bitcoin"
descriptor_env = "QPAYD_Q32_DESCRIPTOR"
address_index_namespace = "q32"
electrum_servers = ["ssl://electrum.blockstream.info:50002"]

[stores.lightning]
backend = "phoenixd"
url = "http://127.0.0.1:9740"
api_password_env = "PHOENIXD_LIMITED_PASSWORD"

[stores.lightning_sweep]
backend = "phoenixd"
url = "http://127.0.0.1:9740"
full_api_password_env = "PHOENIXD_FULL_PASSWORD"
destination_descriptor_env = "QPAYD_Q32_DESCRIPTOR"
min_balance_sats = 100000
target_balance_sats = 25000
interval_seconds = 3600

[[stores.payment_links]]
id = "qpayd-donate"
amount = "10.00"
currency = "USD"
public_allowed_origins = ["https://qpayd.com", "https://earonesty.github.io"]
metadata = { kind = "donation", project = "qpayd", site = "qpayd.com" }

[[stores]]
id = "getflight"
name = "GetFlight.UK"
api_token_env = "QPAYD_GETFLIGHT_API_TOKEN"
payout_token_env = "QPAYD_GETFLIGHT_PAYOUT_TOKEN"
webhook_url = "https://getflight.uk/v1/webhooks/qpayd"
webhook_secret_env = "QPAYD_GETFLIGHT_WEBHOOK_SECRET"
invoice_expiry_minutes = 15
min_confirmations = 1
public_allowed_origins = ["https://getflight.uk", "https://getflight-preview.erik-f0c.workers.dev"]
admin_allowed_origins = ["https://pay-q32.fly.dev"]

[stores.onchain]
network = "bitcoin"
descriptor_env = "QPAYD_GETFLIGHT_DESCRIPTOR"
electrum_servers = ["ssl://electrum.blockstream.info:50002"]

[stores.lightning]
backend = "phoenixd"
url = "http://127.0.0.1:9740"
api_password_env = "PHOENIXD_LIMITED_PASSWORD"

[stores.lightning_payout]
backend = "phoenixd"
url = "http://127.0.0.1:9740"
full_api_password_env = "PHOENIXD_FULL_PASSWORD"

[stores.lightning_payout.refunds]
enabled = true
max_refund_sats = 1000000
daily_refund_limit_sats = 5000000
manual_approval_threshold_sats = 1000000
poll_seconds = 30

[[stores]]
id = "markbegone"
name = "MarkBeGone"
api_token_env = "QPAYD_MARKBEGONE_API_TOKEN"
webhook_url = "https://markbegone.com/api/webhooks/qpayd"
webhook_secret_env = "QPAYD_MARKBEGONE_WEBHOOK_SECRET"
invoice_expiry_minutes = 15
min_confirmations = 1
public_allowed_origins = ["https://markbegone.com", "https://www.markbegone.com"]
admin_allowed_origins = ["https://pay-q32.fly.dev"]

[stores.onchain]
network = "bitcoin"
descriptor_env = "QPAYD_Q32_DESCRIPTOR"
address_index_namespace = "q32"
electrum_servers = ["ssl://electrum.blockstream.info:50002"]

[stores.lightning]
backend = "phoenixd"
url = "http://127.0.0.1:9740"
api_password_env = "PHOENIXD_LIMITED_PASSWORD"
