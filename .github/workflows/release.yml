name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -- --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --locked

      - name: Package binary
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package="qpayd-${tag}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${package}"
          cp target/release/qpayd "dist/${package}/qpayd"
          cp README.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (cd dist && sha256sum "${package}.tar.gz" > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "${tag}" \
            --verify-tag \
            --title "qpayd ${tag}" \
            --generate-notes \
            dist/*.tar.gz \
            dist/SHA256SUMS
