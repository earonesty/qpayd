name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qpayd_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qpayd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_URL: postgres://postgres:postgres@localhost:5432/qpayd_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - run: cargo fmt -- --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: npm --prefix js run check
      - run: npm --prefix site ci
      - run: ./scripts/smoke-barkd.sh
      - run: cargo build --release --locked

      - name: Package binary
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package="qpayd-${tag}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${package}"
          cp target/release/qpayd "dist/${package}/qpayd"
          cp README.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (cd dist && sha256sum "${package}.tar.gz" > SHA256SUMS)

      - name: Render admin portal metadata
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          admin_version="${tag#v}"
          admin_asset_source="https://cdn.jsdelivr.net/npm/@qpayd/admin@${admin_version}/src/index.js"
          SITE_OUT_DIR="$PWD/public" npm --prefix site run build
          OUT_DIR="$PWD/dist" \
            QPAYD_VERSION="${tag}" \
            ADMIN_ASSET_SOURCE="${admin_asset_source}" \
            ADMIN_ASSET_INTEGRITY_SOURCE="$PWD/js/packages/admin/src/index.js" \
            npm --prefix site run render-admin-metadata
          mkdir -p public/docs
          cp dist/admin-portal.json public/docs/admin-portal.latest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "${tag}" \
            --verify-tag \
            --title "qpayd ${tag}" \
            --generate-notes \
            dist/admin-portal.json \
            dist/*.tar.gz \
            dist/SHA256SUMS

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
