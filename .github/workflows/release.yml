name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qpayd_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qpayd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_URL: postgres://postgres:postgres@localhost:5432/qpayd_test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -- --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: npm --prefix js run check
      - run: npm --prefix site ci
      - run: ./scripts/smoke-barkd.sh
      - run: cargo build --release --locked

      - name: Package binary
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package="qpayd-${tag}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${package}"
          cp target/release/qpayd "dist/${package}/qpayd"
          cp README.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (cd dist && sha256sum "${package}.tar.gz" > SHA256SUMS)

      - name: Render admin portal docs
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          SITE_OUT_DIR="$PWD/public" npm --prefix site run build
          OUT_DIR="$PWD/dist" QPAYD_VERSION="${tag}" npm --prefix site run render-admin-portal

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "${tag}" \
            --verify-tag \
            --title "qpayd ${tag}" \
            --generate-notes \
            dist/admin-portal.md \
            dist/admin-portal.html \
            dist/*.tar.gz \
            dist/SHA256SUMS
