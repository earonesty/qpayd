name: npm-publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@11.11.0
      - run: npm --prefix js run check
      - run: npm publish --access public --provenance --workspace @qpayd/checkout --prefix js
      - run: npm publish --access public --provenance --workspace @qpayd/admin --prefix js
