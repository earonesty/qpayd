app = "YOUR_APP"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  QPAYD_MIGRATE_ON_BOOT = "true"
  RUST_LOG = "qpayd=info,tower_http=info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

[[mounts]]
  source = "qpayd_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
